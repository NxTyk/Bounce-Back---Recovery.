<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BOUNCE BACK</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#0b0914;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;outline:none}
#touch{display:none;position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none}
#touch .b{position:absolute;pointer-events:auto;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);color:#fff;font:bold 11px monospace;display:flex;align-items:center;justify-content:center;touch-action:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="touch">
  <div class="b" data-k="up" style="left:62px;bottom:122px">UP</div>
  <div class="b" data-k="down" style="left:62px;bottom:10px">DN</div>
  <div class="b" data-k="left" style="left:6px;bottom:66px">LT</div>
  <div class="b" data-k="right" style="left:118px;bottom:66px">RT</div>
  <div class="b" data-k="bounce" style="right:10px;bottom:84px;width:64px;height:64px">BOUNCE</div>
  <div class="b" data-k="act" style="right:84px;bottom:20px">ACT</div>
</div>
<script>
(()=>{
'use strict';
/* =====================  BOUNCE BACK  ===================== */
const T=16,VW=320,VH=240,LAST=6; // LAST = index of the final (boss) stage
const PK={seed:1,trash:1,brick:1,heart:1,ember:1,sponge:1,cell:1}; // things you can pick up
const NEEDMSG={tree:'NEED A SEED!',purifier:'NEED TRASH!',building:'NEED A BRICK!',iceblock:'NEED AN EMBER!',coral:'NEED A SPONGE!',reactor:'NEED AN ENERGY CELL!'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=VW;cv.height=VH;ctx.imageSmoothingEnabled=false;
function fit(){const s=Math.min(innerWidth/VW,innerHeight/VH);const k=s>=2?Math.floor(s):s;cv.style.width=VW*k+'px';cv.style.height=VH*k+'px';}
addEventListener('resize',fit);fit();

/* ---------- utils ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function C(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return[c,x]}
function px(x,col,a,b,w=1,h=1){x.fillStyle=col;x.fillRect(a,b,w,h)}
function R(col,a,b,w,h){ctx.fillStyle=col;ctx.fillRect(a,b,w,h)}
function disc(cx,cy,r,col){ctx.fillStyle=col;for(let j=-r;j<=r;j++){const w=Math.floor(Math.sqrt(r*r-j*j));ctx.fillRect(Math.round(cx-w),Math.round(cy+j),w*2,1)}}

/* ---------- pixel font (3x5) ---------- */
const FD={A:[2,5,7,5,5],B:[6,5,6,5,6],C:[3,4,4,4,3],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],G:[3,4,5,5,3],H:[5,5,7,5,5],I:[7,2,2,2,7],J:[1,1,1,5,2],K:[5,5,6,5,5],L:[4,4,4,4,7],M:[5,7,7,5,5],N:[6,5,5,5,5],O:[2,5,5,5,2],P:[6,5,6,4,4],Q:[2,5,5,6,3],R:[6,5,6,5,5],S:[3,4,2,1,6],T:[7,2,2,2,2],U:[5,5,5,5,7],V:[5,5,5,5,2],W:[5,5,7,7,5],X:[5,5,2,5,5],Y:[5,5,2,2,2],Z:[7,1,2,4,7],
'0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[6,1,2,4,7],'3':[6,1,2,1,6],'4':[5,5,7,1,1],'5':[7,4,6,1,6],'6':[3,4,7,5,7],'7':[7,1,2,2,2],'8':[7,5,7,5,7],'9':[7,5,7,1,6],
'.':[0,0,0,0,2],',':[0,0,0,2,4],'!':[2,2,2,0,2],'?':[6,1,2,0,2],':':[0,2,0,2,0],'-':[0,0,7,0,0],'/':[1,1,2,4,4],'%':[5,1,2,4,5],"'":[2,2,0,0,0],'+':[0,2,7,2,0],'>':[4,2,1,2,4],'*':[5,2,7,2,5],'<':[1,2,4,2,1],'(':[2,4,4,4,2],')':[2,1,1,1,2]};
function drawStr(s,x,y,sc,col){ctx.fillStyle=col;let cx=x;for(const ch of s){const g=FD[ch];if(g){for(let r=0;r<5;r++){const row=g[r];for(let c=0;c<3;c++)if(row&(4>>c))ctx.fillRect(cx+c*sc,y+r*sc,sc,sc)}}cx+=4*sc}}
function txt(s,x,y,sc=1,col='#fff',sh='#000'){s=String(s).toUpperCase();if(sh)drawStr(s,x+sc,y+sc,sc,sh);drawStr(s,x,y,sc,col)}
function tw(s,sc){return String(s).length*4*sc-sc}
function ctxt(s,y,sc=1,col='#fff',sh='#000'){txt(s,Math.round((VW-tw(s,sc))/2),y,sc,col,sh)}
function wrap(s,n){const w=s.split(' ');const out=[];let cur='';for(const a of w){if((cur+' '+a).trim().length>n){out.push(cur);cur=a}else cur=(cur+' '+a).trim()}if(cur)out.push(cur);return out}

/* ---------- input ---------- */
const keys={},pressed={};
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'bounce',KeyZ:'bounce',KeyJ:'bounce',KeyE:'act',Enter:'act',KeyX:'act',KeyK:'act',KeyM:'mute',KeyP:'pause',Escape:'pause'};
function setKey(a,v){if(v&&!keys[a])pressed[a]=true;keys[a]=v}
addEventListener('keydown',e=>{const a=KM[e.code];initAudio();if(a){setKey(a,true);e.preventDefault()}});
addEventListener('keyup',e=>{const a=KM[e.code];if(a){keys[a]=false;e.preventDefault()}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
cv.addEventListener('pointerdown',()=>{cv.focus();initAudio();if(state==='title'||dlg||state==='ending')pressed.act=true});
try{if(matchMedia('(pointer:coarse)').matches)document.getElementById('touch').style.display='block'}catch(e){}
document.querySelectorAll('#touch .b').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{initAudio();setKey(k,true);e.preventDefault()});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>{keys[k]=false}));});
const okPress=()=>pressed.act||pressed.bounce;

/* ---------- audio ---------- */
let AC=null,muted=false,mi=0;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}
function tone(f,d,type='square',v=.05,slide=0,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03)}
const SFX={
 bounce:()=>tone(300,.15,'square',.05,420),
 pick:()=>{tone(700,.06,'square',.04);tone(1050,.09,'square',.04,0,.06)},
 plant:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.09,0,i*.08)),
 pure:()=>[392,523,659].forEach((f,i)=>tone(f,.18,'triangle',.09,0,i*.1)),
 build:()=>[330,415,523,659].forEach((f,i)=>tone(f,.15,'square',.05,0,i*.07)),
 hurt:()=>tone(220,.3,'sawtooth',.06,-140),
 pop:()=>tone(520,.1,'square',.05,-320),
 no:()=>tone(140,.12,'square',.05),
 clear:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.09,0,i*.1)),
 bb:()=>[392,523,659,784].forEach((f,i)=>tone(f,.2,'square',.05,0,i*.1)),
 boss:()=>tone(90,.4,'sawtooth',.08,-30),
 crash:()=>tone(120,.4,'square',.08,-80)};
function sfx(n){try{SFX[n]&&SFX[n]()}catch(e){}}
function musicTick(){if(!AC||muted||document.hidden)return;const h=health(),maj=h>.45,sc=maj?[0,2,4,7,9]:[0,3,5,7,10],root=maj?262:196;mi++;
 if(mi%2===0&&Math.random()<.85){const d=sc[(Math.random()*5)|0]+(Math.random()<.3?12:0);tone(root*Math.pow(2,d/12),.3,'triangle',.035)}
 if(mi%8===0)tone(root/2,.8,'triangle',.05);
 if((S&&S.type==='boss')&&state==='play'&&mi%4===0)tone(root/4,.2,'sawtooth',.03)}
setInterval(musicTick,240);

/* ---------- pixel art generation ---------- */
const TL={dead:[],alive:[],rock:[],wpol:[],wcl:[],road:{},plaza:{},treeA:[],smog:[],decD:[],decA:[],bld:{}};
function mkGround(alive,seed){const[c,x]=C(16,16),r=mulberry(seed);
 if(!alive){px(x,'#7d6140',0,0,16,16);const cs=['#6c5236','#8c6f4a','#5c452d'];for(let i=0;i<16;i++)px(x,cs[i%3],r()*15|0,r()*15|0,1+(r()*2|0),1);
  let a=r()*12|0,b=r()*12|0;for(let i=0;i<6;i++){px(x,'#4d3925',a,b);if(r()<.5)a++;else b++}}
 else{px(x,'#4fb04b',0,0,16,16);for(let i=0;i<10;i++){const a=r()*14|0,b=1+(r()*14|0);px(x,'#3e9a3f',a,b,2,1);px(x,'#79d96d',a+1,b-1,1,1)}
  if(r()<.4){const a=3+(r()*10|0),b=3+(r()*10|0),col=['#ffe14d','#ff9ecb','#ffffff'][r()*3|0];px(x,col,a,b-1);px(x,col,a-1,b);px(x,col,a+1,b);px(x,col,a,b+1);px(x,'#ffb300',a,b)}}
 return c}
function mkRock(seed){const[c,x]=C(16,16),r=mulberry(seed);px(x,'#6b5338',0,0,16,16);
 px(x,'#4b4858',1,4,14,11);px(x,'#4b4858',3,2,10,2);px(x,'#6f6b7e',2,4,12,9);px(x,'#6f6b7e',4,3,8,1);px(x,'#9b97ad',3,4,7,2);px(x,'#9b97ad',4,3,5,1);px(x,'#4b4858',2,12,12,2);
 px(x,'#3b3947',4+(r()*6|0),7,1,3);px(x,'#3b3947',9,9+(r()*2|0),3,1);return c}
function mkWater(clean,f){const[c,x]=C(16,16);const base=clean?'#2f8bdc':'#55622b',hi=clean?'#7cc4f5':'#7f8f35',lo=clean?'#1f66b4':'#343d1c',ac=clean?'#d8f1ff':'#a2b13f';
 px(x,base,0,0,16,16);for(const row of[2,7,12]){const off=(row*3+f*5)%16;px(x,hi,off,row,Math.min(5,16-off),1);px(x,lo,(off+8)%16,row+2,3,1)}
 if(clean){px(x,ac,f?6:11,4);px(x,ac,f?2:13,10)}else{px(x,ac,f?3:9,5,2,1);px(x,lo,f?10:4,9,3,2)}return c}
function mkBridge(){const[c,x]=C(16,16);px(x,'#9b6b38',0,0,16,16);for(let i=3;i<16;i+=4)px(x,'#6b4522',i,0,1,16);px(x,'#5a3a1c',0,0,16,2);px(x,'#5a3a1c',0,14,16,2);px(x,'#c28d50',0,2,16,1);px(x,'#c28d50',0,13,16,1);return c}
function mkRoad(alive,side,seed){const[c,x]=C(16,16),r=mulberry(seed);px(x,alive?'#6a6877':'#46424d',0,0,16,16);
 for(let i=0;i<10;i++)px(x,alive?'#797688':'#3d3a45',r()*15|0,r()*15|0);
 if(!alive){let a=r()*12|0,b=r()*12|0;for(let i=0;i<7;i++){px(x,'#2c2933',a,b);if(r()<.5)a++;else b++}}
 else if(side){const d='#f2d95c';if(side===1)px(x,d,2,15,12,1);if(side===2)px(x,d,2,0,12,1);if(side===3)px(x,d,15,2,1,12);if(side===4)px(x,d,0,2,1,12)}return c}
function mkPlaza(alive){const[c,x]=C(16,16);const a=alive?'#a49fb8':'#3d3947',b=alive?'#8e89a6':'#34303f';px(x,a,0,0,16,16);px(x,b,0,0,8,8);px(x,b,8,8,8,8);px(x,alive?'#c6c2d6':'#2b2835',0,0,16,1);px(x,alive?'#c6c2d6':'#2b2835',0,0,1,16);return c}
function mkTreeDead(){const[c,x]=C(16,24);const t='#4f3a24',b='#6a4f33';px(x,t,6,10,4,14);px(x,'#3b2a1a',6,10,1,14);
 px(x,b,4,9,2,1);px(x,b,3,7,2,2);px(x,b,2,5,1,3);px(x,b,10,8,2,1);px(x,b,11,6,2,2);px(x,b,13,4,1,3);px(x,b,7,6,2,4);px(x,b,6,4,1,2);px(x,b,9,3,1,3);px(x,'#7a7a6a',3,9,1,1);px(x,'#7a7a6a',12,7,1,1);px(x,t,5,22,6,2);return c}
function mkTreeAlive(v){const[c,x]=C(16,24);px(x,'#6b4423',6,14,4,10);px(x,'#523319',6,14,1,10);px(x,'#523319',5,22,6,2);
 const ws=[6,10,12,14,14,16,16,16,14,14,12,10,6];ws.forEach((w,i)=>px(x,v?'#2f8f3a':'#3a9a3c',(16-w)/2,1+i,w,1));
 ws.forEach((w,i)=>{if(i>1&&i<8)px(x,v?'#58c24f':'#6ad25a',(16-w)/2+1,1+i,Math.max(2,w-8),1)});
 [8,9,10,11,12].forEach(i=>px(x,v?'#1e6b2e':'#2a7d33',(16-ws[i-1])/2+ws[i-1]-4,1+i,3,1));
 if(v){px(x,'#e53935',4,7,2,2);px(x,'#e53935',10,10,2,2);px(x,'#e53935',7,5,2,2)}else{px(x,'#ffe14d',4,7,2,2);px(x,'#ff9ecb',11,9,2,2)}return c}
function mkSmog(f){const[c,x]=C(16,16);const rows=[[5,6],[3,10],[2,12],[1,14],[1,14],[1,14],[2,12],[3,10],[4,8]];
 rows.forEach(([a,w],i)=>px(x,'#7a69a0',a,2+i,w,1));px(x,'#a898cf',4,3,5,1);px(x,'#a898cf',3,4,3,1);px(x,'#4a3d6b',3,10,10,1);px(x,'#4a3d6b',4,11,8,1);
 px(x,'#7a69a0',f?0:1,8,2,2);px(x,'#7a69a0',f?14:13,6,2,2);px(x,'#4a3d6b',f?5:8,12,3,2);
 px(x,'#fff',4,6,3,3);px(x,'#fff',9,6,3,3);px(x,'#e63946',5,7,2,2);px(x,'#e63946',10,7,2,2);px(x,'#1f1633',4,5,3,1);px(x,'#1f1633',9,5,3,1);px(x,'#1f1633',6,11,4,1);return c}
function mkDecor(alive,k){const[c,x]=C(16,16);
 if(!alive){if(k===0){px(x,'#5a4430',7,7,1,6);px(x,'#5a4430',5,8,2,1);px(x,'#5a4430',8,9,3,1);px(x,'#5a4430',6,6,1,2);px(x,'#5a4430',9,7,2,1)}
  else if(k===1){px(x,'#8a8394',6,10,4,3);px(x,'#a29bad',6,10,3,1)}else{px(x,'#d9d2bf',5,10,6,1);px(x,'#d9d2bf',4,9,1,2);px(x,'#d9d2bf',11,9,1,2)}}
 else{const col=['#ff7ab8','#ffe14d','#9ad0ff'][k];px(x,'#2f8f3a',8,9,1,4);px(x,col,7,7,3,1);px(x,col,8,6,1,3);px(x,'#fff',8,7,1,1);if(k===2){px(x,col,4,10,3,1);px(x,col,5,9,1,3);px(x,'#2f8f3a',5,12,1,1)}}return c}
const BP=[['#e7b94a','#a8452f'],['#7fb7e6','#35508a'],['#e68fb0','#8a3560'],['#9bd67a','#3c7a3a'],['#f0a15e','#8a4a2a'],['#b59be6','#5b3a8a']];
function mkBuilding(pal,fixed){const[c,x]=C(64,48);const[wall,roof]=BP[pal];const Wl=fixed?wall:'#5d5a6b',Rf=fixed?roof:'#3a3544',dk=fixed?'rgba(0,0,0,.25)':'#2d2936';
 px(x,Rf,0,2,64,18);px(x,dk,0,0,64,2);for(let j=7;j<20;j+=6)px(x,dk,0,j,64,1);px(x,fixed?'rgba(255,255,255,.25)':'#4a4458',0,2,64,1);px(x,dk,0,19,64,1);
 px(x,Wl,2,20,60,28);px(x,fixed?'rgba(0,0,0,.18)':'#4a4757',2,44,60,4);
 const wn=fixed?'#ffe27a':'#15131c';px(x,wn,8,26,10,10);px(x,wn,46,26,10,10);
 if(fixed){px(x,'#fff6c2',12,26,1,10);px(x,'#fff6c2',8,30,10,1);px(x,'#fff6c2',50,26,1,10);px(x,'#fff6c2',46,30,10,1);px(x,'#3c7a3a',8,37,10,2);px(x,'#ff7ab8',9,36,2,1);px(x,'#ffe14d',14,36,2,1);px(x,'#3c7a3a',46,37,10,2);px(x,'#ff7ab8',48,36,2,1);px(x,'#ffe14d',53,36,2,1);
  px(x,'#7a4a22',27,32,10,16);px(x,'#9a6a3a',28,33,8,14);px(x,'#ffd54a',34,40,1,1)}
 else{px(x,'#33303f',14,20,1,10);px(x,'#33303f',15,30,3,1);px(x,'#33303f',52,22,1,8);px(x,'#15131c',38,6,8,6);px(x,'#15131c',10,10,5,5);px(x,'#2a2833',27,32,10,16);px(x,'#6a4a2a',26,36,12,2);px(x,'#6a4a2a',26,42,12,2);px(x,'#6a4a2a',31,32,2,16)}
 return c}
function buildTiles(){
 for(let i=0;i<4;i++){TL.dead.push(mkGround(false,i+1));TL.alive.push(mkGround(true,i+11))}
 for(let i=0;i<3;i++)TL.rock.push(mkRock(i+21));
 for(let f=0;f<2;f++){TL.wpol.push(mkWater(false,f));TL.wcl.push(mkWater(true,f))}
 TL.bridge=mkBridge();
 for(const al of[0,1])for(let s=0;s<5;s++)TL.road[al+'_'+s]=mkRoad(!!al,s,s*7+al+31);
 TL.plaza[0]=mkPlaza(false);TL.plaza[1]=mkPlaza(true);
 TL.treeD=mkTreeDead();TL.treeA.push(mkTreeAlive(0),mkTreeAlive(1));
 TL.smog.push(mkSmog(0),mkSmog(1));
 for(let k=0;k<3;k++){TL.decD.push(mkDecor(false,k));TL.decA.push(mkDecor(true,k))}
 for(let p=0;p<6;p++)for(const f of[0,1])TL.bld[p+'_'+f]=mkBuilding(p,!!f);
}
buildTiles();

/* ====================  EXTRA WORLDS: ART  ==================== */
// Each "theme" is a bundle of tiles. A stage picks one with mkStage(w,h,type,'themeName').
function mkSnow(alive,seed){const[c,x]=C(16,16),r=mulberry(seed);
 if(!alive){px(x,'#b9cee0',0,0,16,16);const cs=['#a3bbd1','#cfe0ee','#9ab2ca'];for(let i=0;i<10;i++)px(x,cs[i%3],r()*15|0,r()*15|0,2+(r()*3|0),1);
  let a=r()*10|0,b=r()*12|0;for(let i=0;i<7;i++){px(x,'#7f9db8',a,b);if(r()<.5)a++;else b++}
  px(x,'#fff',r()*14|0,r()*14|0);px(x,'#fff',r()*14|0,r()*14|0)}
 else{px(x,'#5fae55',0,0,16,16);for(let i=0;i<10;i++){const a=r()*14|0,b=1+(r()*14|0);px(x,'#4c9a49',a,b,2,1);px(x,'#86d97a',a+1,b-1,1,1)}
  if(r()<.4)px(x,'#eef6fb',2+(r()*9|0),3+(r()*9|0),4,2);
  if(r()<.3){const a=3+(r()*10|0),b=3+(r()*10|0),col=['#b48cff','#fff','#ffe14d'][r()*3|0];px(x,col,a,b-1);px(x,col,a-1,b);px(x,col,a+1,b);px(x,col,a,b+1);px(x,'#ffb300',a,b)}}

 [[13,23,14,24],[26,23,27,24],[6,14,7,16],[19,14,20,19],[32,13,33,15],[13,7,14,8],[26,7,27,8]].forEach(r=>rect(...r,4)); // light bridges
 // reactors: each needs 2 energy cells
 [[7,6],[20,6],[32,6],[32,21]].forEach(([x,y])=>{const e=ent(s,'reactor',x,y,{prog:0,need:2,flash:0});e.box={x:e.x+1,y:e.y+3,w:14,h:12}});
 // energy cells
 [[4,20],[9,24],[11,19],[18,22],[22,25],[17,25],[30,19],[35,24],[9,9],[4,10],[22,10],[16,5],[35,5],[30,9]].forEach(([x,y])=>ent(s,'cell',x,y));
 // broken drones
 [[8,22],[20,10],[32,18],[34,6]].forEach(([x,y])=>addSmog(s,x,y));
 s.spawn={x:4,y:25};scatter(s,50,16,g=>g===0);return s}

/* ---------- helpers ---------- */
function say(lines,cb){dlg={L:lines.map(s=>wrap(s.toUpperCase(),34)),i:0,n:0,cb}}
function toast(s){toastO={s,t:1.6}}
function burst(x,y,n,cols,sp=40,life=.6,grav=0){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(sp*.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*rnd(.6,1),m:life,c:cols[i%cols.length],z:Math.random()<.4?2:1,g:grav})}}
function updParts(dt){for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt}parts=parts.filter(p=>p.l>0)}
function revive(cx,cy,r){for(let y=Math.max(0,cy-r);y<=Math.min(S.h-1,cy+r);y++)for(let x=Math.max(0,cx-r);x<=Math.min(S.w-1,cx+r);x++){const d=Math.hypot(x-cx,y-cy);if(d>r)continue;const t=time+d*.09;if(S.g[y][x]!==3&&t<S.aliveAt[y][x])S.aliveAt[y][x]=t}}
function cleanRiver(cx,cy,r){for(let y=Math.max(0,cy-r);y<=Math.min(S.h-1,cy+r);y++)for(let x=Math.max(0,cx-r);x<=Math.min(S.w-1,cx+r);x++){const d=Math.hypot(x-cx,y-cy);if(d>r||S.g[y][x]!==1)continue;const t=time+d*.07;if(t<S.cleanAt[y][x])S.cleanAt[y][x]=t}}
function reviveAll(cx,cy,k){for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++){if(S.g[y][x]===3)continue;const t=time+Math.hypot(x-cx,y-cy)*k;if(t<S.aliveAt[y][x])S.aliveAt[y][x]=t;if(S.g[y][x]===1&&t<S.cleanAt[y][x])S.cleanAt[y][x]=t}}
function hitSolid(x,y,w,h){const x0=Math.floor(x/T),x1=Math.floor((x+w-.001)/T),y0=Math.floor(y/T),y1=Math.floor((y+h-.001)/T);
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(tx<0||ty<0||tx>=S.w||ty>=S.h)return true;const g=S.g[ty][tx];if(g===3||g===1||g===11)return true}
 for(const e of S.ents){const b=e.box;if(b&&x<b.x+b.w&&x+w>b.x&&y<b.y+b.h&&y+h>b.y)return true}return false}
function tryMove(o,dx,dy,hw,hh){let c=false;if(dx){if(!hitSolid(o.x+dx-hw,o.y-hh,hw*2,hh*2))o.x+=dx;else c=true}if(dy){if(!hitSolid(o.x-hw,o.y+dy-hh,hw*2,hh*2))o.y+=dy;else c=true}return c}
function distBox(o,b){const dx=Math.max(b.x-o.x,0,o.x-(b.x+b.w)),dy=Math.max(b.y-o.y,0,o.y-(b.y+b.h));return Math.hypot(dx,dy)}
function progress(){if(!S)return 0;
 const E=S.ents,frac=(t,k)=>{const a=E.filter(e=>e.t===t);return a.length?a.filter(e=>e[k]).length/a.length:0},pr=t=>{const a=E.filter(e=>e.t===t);return a.length?a.reduce((q,e)=>q+e.prog,0)/a.reduce((q,e)=>q+e.need,0):0};
 switch(S.type){
  case 'woods':return frac('tree','alive');
  case 'river':return pr('purifier');
  case 'city':return frac('building','fixed');
  case 'peaks':return frac('iceblock','alive');
  case 'reef':return frac('coral','alive');
  case 'sky':return pr('reactor');
  default:return S.boss?1-S.boss.hp/S.boss.max:0}}
function health(){if(state==='ending')return 1;if(state==='title'||!S)return 0;return clamp((stageIdx+progress())/(LAST+1),0,1)}

function newPlayer(sp){return{x:sp.x*T+8,y:sp.y*T+8,dir:0,fx:0,fy:1,hp:3,max:3,inv:0,bt:0,bc:0,bdx:0,bdy:1,kt:0,kdx:0,kdy:0,walk:0,moving:false,seeds:0,trash:0,bricks:0,embers:0,sponges:0,cells:0,vx:0,vy:0,cpx:sp.x*T+8,cpy:sp.y*T+8,bbT:0,resp:false}}
function loadStage(i){stageIdx=i;S=BUILD[i]();parts=[];P=newPlayer(S.spawn);cam.x=cam.y=0;toastO=null;say(STG[i].intro)}
function fadeTo(cb){trans={ph:'out',a:0,cb}}
function startGame(){G.deaths=0;G.pops=0;G.resolve=0;G.t0=performance.now();fadeTo(()=>{state='play';loadStage(0)})}

/* ---------- gameplay ---------- */
function actionable(e){switch(e.t){case 'tree':return !e.alive&&P.seeds>0;case 'purifier':return e.prog<e.need&&P.trash>0;case 'building':return !e.fixed&&P.bricks>0;case 'iceblock':return !e.alive&&P.embers>0;case 'coral':return !e.alive&&P.sponges>0;case 'reactor':return e.prog<e.need&&P.cells>0}return false}
function needy(e){switch(e.t){case 'tree':case 'iceblock':case 'coral':return !e.alive;case 'purifier':case 'reactor':return e.prog<e.need;case 'building':return !e.fixed}return false}
function doAct(){let best=null,bd=1e9,nb=null,nd=1e9;
 for(const e of S.ents){if(!e.box)continue;const d=distBox(P,e.box);if(d>14)continue;if(actionable(e)){if(d<bd){bd=d;best=e}}else if(needy(e)&&d<nd){nd=d;nb=e}}
 if(best){interact(best);return}
 if(nb){sfx('no');toast(NEEDMSG[nb.t]||'NOT YET!')}}
function interact(e){P.cpx=P.x;P.cpy=P.y;
 if(e.t==='tree'){P.seeds--;e.alive=true;e.gt=0;revive(e.tx,e.ty,3);burst(e.cx,e.cy,16,['#79d96d','#ffe14d','#fff'],60,.8,-10);sfx('plant')}
 else if(e.t==='purifier'){P.trash--;e.prog++;if(e.prog>=e.need){cleanRiver(e.tx,e.ty,14);revive(e.tx,e.ty,6)}else cleanRiver(e.tx,e.ty,e.prog*3);burst(e.cx,e.cy,16,['#7cc4f5','#d8f1ff','#fff'],60,.8);sfx('pure')}
 else if(e.t==='iceblock'){P.embers--;e.alive=true;e.gt=0;revive(e.tx,e.ty,3);burst(e.cx,e.cy,18,['#ffb347','#ff6a2b','#fff3c2','#bfe8ff'],70,.8,-20);sfx('plant')}
 else if(e.t==='coral'){P.sponges--;e.alive=true;e.gt=0;revive(e.tx,e.ty,3);cleanRiver(e.tx,e.ty,10);burst(e.cx,e.cy,18,['#ff7ab8','#ffb347','#7cf5e0','#fff'],60,.8,-10);sfx('pure')}
 else if(e.t==='reactor'){P.cells--;e.prog++;if(e.prog>=e.need){revive(e.tx,e.ty,7);e.flash=.6}else revive(e.tx,e.ty,3);burst(e.cx,e.cy,18,['#5fe3ff','#fff','#b9a7ff'],70,.8);sfx('build')}
 else if(e.t==='building'){P.bricks--;e.fixed=true;e.flash=.6;revive(e.tx+2,e.ty+1,5);burst(e.x+32,e.y+24,20,['#ffe27a','#fff6c2','#ff9ecb'],70,.8);sfx('build');
  for(let i=0;i<2;i++)S.cit.push({x:e.x+24+i*16,y:e.y+e.h*T+8,hx:e.x+32,hy:e.y+e.h*T+10,tx:e.x+32,ty:e.y+e.h*T+10,col:['#e74c3c','#3498db','#f1c40f','#9b59b6','#1abc9c','#e67e22'][(e.pal+i)%6],f:Math.random()*6})}
 checkClear()}
function checkClear(){if(!S.cleared&&stageIdx<LAST&&progress()>=1){S.cleared=true;S.clearT=1.4;sfx('clear');
  for(const m of S.smog){if(!m.dead)burst(m.x,m.y,10,['#a898cf','#fff'],60,.5);m.dead=true;m.rt=1e9}
  if(stageIdx<2)reviveAll(P.x/T,P.y/T,.05);else reviveAll(P.x/T,P.y/T,.06)}}
function hurt(from){P.hp--;P.inv=1.3;const dx=P.x-from.x,dy=P.y-from.y,d=Math.hypot(dx,dy)||1;P.kdx=dx/d;P.kdy=dy/d;P.kt=.18;P.bt=0;shake=.25;sfx('hurt');burst(P.x,P.y,8,['#ff3b4f','#fff'],50,.4);
 if(P.hp<=0){P.hp=0;P.bbT=1.6;P.resp=false;G.deaths++;sfx('bb')}}
function respawn(){P.x=P.cpx;P.y=P.cpy;P.hp=P.max;P.inv=2.2;P.kt=0;P.bt=0;G.resolve=Math.min(3,G.resolve+1);P.resp=true;
 for(const m of S.smog){if(Math.hypot(m.x-P.x,m.y-P.y)<90){m.x=m.hx;m.y=m.hy}}
 if(S.boss&&S.boss.state!=='dead'){S.boss.x=15*T;S.boss.y=9*T;S.boss.state='idle';S.boss.t=2.5}
 burst(P.x,P.y,22,['#6be07a','#ffe14d','#fff'],90,.8)}
function popSmog(m){m.dead=true;m.rt=12;G.pops++;burst(m.x,m.y,14,['#a898cf','#7a69a0','#fff'],70,.5);sfx('pop');if(Math.random()<.3)S.ents.push({t:'heart',x:m.x-4,y:m.y-4,cx:m.x,cy:m.y})}

function updPlayer(dt){
 if(P.inv>0)P.inv-=dt;if(P.bc>0)P.bc-=dt;
 let mx=(keys.right?1:0)-(keys.left?1:0),my=(keys.down?1:0)-(keys.up?1:0);P.moving=!!(mx||my);
 if(P.moving){const l=Math.hypot(mx,my);mx/=l;my/=l;P.fx=mx;P.fy=my;P.dir=Math.abs(mx)>Math.abs(my)?(mx<0?2:3):(my<0?1:0);P.walk+=dt*9}
 if(pressed.bounce&&P.bc<=0&&P.bt<=0&&P.kt<=0){P.bt=.3;P.bc=.7-.1*G.resolve;P.bdx=P.fx;P.bdy=P.fy;sfx('bounce')}
 let vx=mx,vy=my,sp=60*(1+.07*G.resolve);
 if(P.bt>0){P.bt-=dt;vx=P.bdx;vy=P.bdy;sp=150;if(P.bt<=0)burst(P.x,P.y+4,6,['#fff','#cde'],30,.3)}
 else if(P.kt>0){P.kt-=dt;vx=P.kdx;vy=P.kdy;sp=90}
 let tvx=vx*sp,tvy=vy*sp;
 if(S.type==='peaks'&&P.bt<=0&&P.kt<=0){const tx=Math.floor(P.x/T),ty=Math.floor(P.y/T),ice=S.g[ty]&&S.g[ty][tx]===0&&S.aliveAt[ty][tx]>time,k=ice?Math.min(1,dt*2.2):1;P.vx+=(tvx-P.vx)*k;P.vy+=(tvy-P.vy)*k;tvx=P.vx;tvy=P.vy}
 else{P.vx=tvx;P.vy=tvy}
 tryMove(P,tvx*dt,tvy*dt,5,4);
 if(pressed.act)doAct();
 // pickups
 let changed=false;
 for(const e of S.ents){if(e.gone)continue;if(!PK[e.t])continue;
  if(Math.hypot(P.x-e.cx,P.y-e.cy)<11){if(e.t==='heart'&&P.hp>=P.max)continue;e.gone=true;changed=true;sfx('pick');burst(e.cx,e.cy,6,['#fff','#ffe14d'],40,.4);
   if(e.t==='seed')P.seeds++;else if(e.t==='trash')P.trash++;else if(e.t==='brick')P.bricks++;else if(e.t==='ember')P.embers++;else if(e.t==='sponge')P.sponges++;else if(e.t==='cell')P.cells++;else{P.hp=Math.min(P.max,P.hp+1);toast('+1 HEART')}}}
 if(changed)S.ents=S.ents.filter(e=>!e.gone);
}
function updSmog(dt){
 for(const m of S.smog){if(m.dead){m.rt-=dt;if(m.rt<=0){m.dead=false;m.x=m.hx;m.y=m.hy;burst(m.x,m.y,6,['#a898cf'],30,.4)}continue}
  m.ph+=dt;const dx=P.x-m.x,dy=P.y-m.y,d=Math.hypot(dx,dy)||1;let vx=Math.cos(m.ph*.8+m.s)*10,vy=Math.sin(m.ph*.6+m.s*2)*10;
  if(d<90&&P.bbT<=0){vx=dx/d*30;vy=dy/d*30}
  m.x=clamp(m.x+vx*dt,T+4,S.w*T-T-4);m.y=clamp(m.y+vy*dt,T+4,S.h*T-T-4);
  if(P.bt>0&&d<13)popSmog(m);else if(d<10&&P.inv<=0&&P.bt<=0&&P.bbT<=0)hurt(m)}}
function updCit(dt){for(const c of S.cit){c.f+=dt*6;const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);
  if(d<2||Math.random()<.004){const a=Math.random()*6.283,r=rnd(6,S.party?60:30);c.tx=c.hx+Math.cos(a)*r;c.ty=c.hy+Math.sin(a)*r}
  else{const nx=c.x+dx/d*14*dt,ny=c.y+dy/d*14*dt;if(!hitSolid(nx-3,ny-2,6,4)){c.x=nx;c.y=ny}else{c.tx=c.x;c.ty=c.y}}}}
function moveBoss(b,vx,vy,dt){let c=false;const w=13;if(vx){if(!hitSolid(b.x+vx*dt-w,b.y-w,w*2,w*2))b.x+=vx*dt;else c=true}if(vy){if(!hitSolid(b.x-w,b.y+vy*dt-w,w*2,w*2))b.y+=vy*dt;else c=true}return c}
function updBoss(dt){const b=S.boss;
 if(b.state==='dead'){b.t-=dt;if(Math.random()<.3)burst(b.x+rnd(-14,14),b.y+rnd(-14,14),6,['#a898cf','#fff','#ffe14d','#2ee6ff'],80,.7);
  if(b.t<=0&&!b.done){b.done=true;say(STG[LAST].clear,()=>{state='ending';endT=0;fwT=0;G.tEnd=performance.now()})}return}
 b.hitCd-=dt;b.t-=dt;const dx=P.x-b.x,dy=P.y-b.y,d=Math.hypot(dx,dy)||1;
 if(b.state==='idle'){moveBoss(b,dx/d*22,dy/d*22,dt);if(b.t<=0){b.state='tele';b.t=.9;sfx('boss')}}
 else if(b.state==='tele'){if(b.t<=0){b.dx=dx/d;b.dy=dy/d;b.state='dash';b.t=.85}}
 else if(b.state==='dash'){const hit=moveBoss(b,b.dx*150,b.dy*150,dt);
  if(hit){b.state='stun';b.t=3.2;shake=.4;sfx('crash');burst(b.x,b.y,16,['#ffe14d','#fff','#a898cf'],80,.6)}else if(b.t<=0){b.state='recover';b.t=1}}
 else if(b.state==='recover'){if(b.t<=0){b.state='idle';b.t=2.2}}
 else if(b.state==='hurt'){if(b.t<=0){b.state='idle';b.t=2}}
 else if(b.state==='stun'){if(b.t<=0){b.state='idle';b.t=1.5}}
 if(P.bbT<=0&&d<20){
  if(P.bt>0){if(b.state==='stun'&&b.hitCd<=0){b.hp--;b.hitCd=.6;b.state='hurt';b.t=.9;shake=.35;sfx('crash');burst(b.x,b.y,24,['#2ee6ff','#fff','#ffe14d'],110,.7);
    revive(15,12,Math.max(3,(b.max-b.hp)*4));
    if(b.hp<=0){b.hp=0;b.state='dead';b.t=2.6;S.cleared=true;reviveAll(15,12,.07);for(const m of S.smog){m.dead=true;m.rt=1e9}
     S.party=true;for(let i=0;i<14;i++){const x=2+Math.floor(Math.random()*26),y=2+Math.floor(Math.random()*20);S.cit.push({x:x*T+8,y:y*T+8,hx:x*T+8,hy:y*T+8,tx:x*T+8,ty:y*T+8,col:['#e74c3c','#3498db','#f1c40f','#9b59b6','#1abc9c','#e67e22'][i%6],f:Math.random()*6})}}}
   else if(b.state!=='stun'&&b.state!=='hurt'){P.kdx=-dx/d;P.kdy=-dy/d;P.kt=.2;P.bt=0;sfx('no')}}
  else if(b.state!=='stun'&&b.state!=='hurt'&&b.state!=='recover'&&P.inv<=0)hurt(b)}}
function ambient(dt){snowFall(dt);amb+=dt;if(amb>.35){amb=0;const x=Math.floor((cam.x+Math.random()*VW)/T),y=Math.floor((cam.y+Math.random()*VH)/T);
  if(x>=0&&y>=0&&x<S.w&&y<S.h&&S.aliveAt[y][x]<=time&&S.g[y][x]!==3&&S.g[y][x]!==1&&S.g[y][x]!==11)parts.push({x:x*T+8,y:y*T+8,vx:rnd(-8,8),vy:rnd(-12,-4),l:2,m:2,c:['#ff9ecb','#ffe14d','#9ad0ff','#fff'][Math.random()*4|0],z:1,g:0})}
 if(S.type==='river'||S.type==='reef'||state==='ending'){fishT+=dt;if(fishT>.5){fishT=0;for(let k=0;k<60;k++){const x=1+Math.floor(Math.random()*(S.w-2)),y=1+Math.floor(Math.random()*(S.h-2));if(S.g[y][x]===1&&S.cleanAt[y][x]<=time){S.fish.push({x:x*T+8,y:y*T+8,t:0});break}}}}
 for(const f of S.fish)f.t+=dt/.8;S.fish=S.fish.filter(f=>f.t<1)}

function playUpdate(dt){
 if(dlg){updDlg(dt);updParts(dt);updCit(dt);ambient(dt);return}
 if(pressed.pause)paused=!paused;if(paused)return;
 if(toastO){toastO.t-=dt;if(toastO.t<=0)toastO=null}
 if(shake>0)shake-=dt;
